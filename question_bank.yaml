# ===========================================================================
# LAYER 11 — KNOWN-SCHEME BRANCH (5). intent == known_scheme skips everything
# above. Kept from v2 unchanged - catalogue-agnostic, well-designed:
# speech-primary with a mandatory confirm-back loop (never act on an
# unconfirmed spoken name), category fallback when ASR fails.
# ===========================================================================
- id: Q100_SCHEME_NAME
  layer: known_scheme
  writes: _named_scheme
  requires: "intent == 'known_scheme'"
  gain: 10
  why: "Short-circuits the entire narrowing loop. One speech turn replaces six DTMF turns."
  tags: [known_scheme, speech_primary]
  say_key: q100_scheme_name
  prompt_hi: "Yojna ka naam boliye."
  prompt_en: "Say the scheme name."
  # SPEECH IS THE POINT HERE. A scheme name cannot be typed on a keypad.
  collect: {digits: 0, speech: true}
  speech_intents: [SCHEME_NAME, UNKNOWN]
  speech_attempts: 2
  on_unclear:
    hi: "Mujhe samajh nahi aaya. Yojna ka naam dobara boliye."
    en: "I did not understand. Please say the scheme name again."
  after_max_speech:
    next: Q101_SCHEME_CATEGORY
    hi: "Koi baat nahi. Button se dhoondhte hain."
  # NEVER accept a spoken name without reading it back. This is the single
  # guard against announcing a scheme the caller never asked for.
  on_match: {next: Q100B_CONFIRM_SCHEME}
  on_unknown: {next: Q101_SCHEME_CATEGORY}

- id: Q100B_CONFIRM_SCHEME
  layer: known_scheme
  writes: _scheme_confirmed
  requires: "_named_scheme is answered"
  gain: 9
  why: "Reads the matched scheme and its benefit back before committing, so a misheard name is caught by the caller and never by the demo audience."
  tags: [known_scheme, confirmation, safety]
  say_key: q100b_confirm
  # Template. {name_short_hi} and {benefit_one_line} come from the DB row,
  # never from the model. If the row has no benefit_one_line, say the name only.
  prompt_hi: "Aap {name_short_hi} ki baat kar rahe hain. Isme {benefit_one_line}. Sahi hai to 1 dabaiye. Nahi to 2 dabaiye."
  prompt_en: "You mean {name_short_hi}. It gives {benefit_one_line}. Press 1 if correct, 2 if not."
  speech_intents: [YES, NO, UNKNOWN]
  dtmf:
    "1": {set: {_scheme_confirmed: "yes"}, hi: "Sahi hai", en: "Correct"}
    "2": {set: {_scheme_confirmed: "no"},  hi: "Nahi", en: "No", next: Q100_SCHEME_NAME}
  # Second miss on the same name means our matcher is wrong, not the caller.
  # Do not loop a third time - go to the category menu.
  on_second_no: {next: Q101_SCHEME_CATEGORY}

- id: Q101_SCHEME_CATEGORY
  layer: known_scheme
  writes: theme
  requires: "intent == 'known_scheme' and _named_scheme == 'UNKNOWN'"
  gain: 7
  why: "Fallback when ASR cannot resolve the spoken name. Never guess a scheme; narrow by the real theme menu instead."
  tags: [known_scheme, fallback]
  say_key: q101_scheme_category
  prompt_hi: "Naam samajh nahi aaya. Kis tarah ki yojna chahiye? Vyapar ke liye 1 dabaiye. Bunkar ke liye 2 dabaiye. Machhli palan ke liye 3 dabaiye. Prashikshan ke liye 4 dabaiye. Kheti ke liye 5 dabaiye. Pension madad ke liye 6 dabaiye."
  prompt_en: "I didn't catch that. What kind of scheme do you need? For business, press 1. For craft, press 2. For fisheries, press 3. For training, press 4. For farming, press 5. For welfare, press 6."
  dtmf:
    "1": {set: {theme: business}, hi: "Vyapar", en: "Business"}
    "2": {set: {theme: craft}, hi: "Bunkar", en: "Craft"}
    "3": {set: {theme: fisheries}, hi: "Machhli palan", en: "Fisheries"}
    "4": {set: {theme: training}, hi: "Prashikshan", en: "Training"}
    "5": {set: {theme: farming}, hi: "Kheti", en: "Farming"}
    "6": {set: {theme: welfare}, hi: "Pension madad", en: "Welfare"}

- id: Q102_WHICH_FIELD
  layer: known_scheme
  writes: _field_wanted
