# Haqdaar Voice — Question Bank v3  (grounded in the real 100-scheme catalogue)
# ---------------------------------------------------------------------------
# This file is DATA, not code. The engine reads it; the LLM never edits it.
#
# v3 = v2's persona/session/known-scheme layers (kept, they are catalogue-
# agnostic and good) + a full rewrite of the purpose/occupation/attribute
# layers against optimized_schemes.json via scripts/ingest.py. v1 and v2 were
# both built around a farmer-first, crop-insurance-heavy assumption that
# CHANGE_REPORT.md already disproved once (v4->v5): this catalogue is 52%
# business/MSME, 13% craft, 10% training, 10% welfare, 9% fisheries, 6%
# farming, and has ZERO crop-insurance schemes. Every attribute below was
# checked against real eligibility/benefits text before being kept - see the
# frequency counts in the Step-2 build notes. Dead attributes from v1/v2
# (has_kcc, livestock, irrigation_source, fpo_member, has_soil_health_card,
# crop_category/season/is_organic/damage_cause, pmkisan_registered) are
# removed: each matched 0-2 schemes in the real data and would burn a
# question turn on the 10-question budget for nothing.
#
# State is now a LATE tiebreaker (gain 3, single-step), not an early two-step
# gate. Reason: 62/100 schemes are Puducherry, 16/100 West Bengal - state is
# close to a constant on this catalogue, not a discriminator (CHANGE_REPORT
# #3). It still never eliminates a scheme whose state_scope is NULL.
#
# Contract:
#   - Every question writes exactly ONE attribute from attribute_seed.sql.
#   - `requires` is a boolean expression over answered attributes. If it does
#     not evaluate TRUE, the question is NOT askable. This is the DAG edge.
#   - `gain` is a static prior (1-10) used only to break ties before any
#     answers exist. After turn 1 the engine computes real information gain
#     from the live candidate set and `gain` is ignored.
#   - DTMF answers use keys 1-9 ONLY. 0, * and # are globally reserved.
#   - `speech: true` at every node (PRD §3.1, audio-overrides-buttons).
# ---------------------------------------------------------------------------

meta:
  version: 3
  question_count: 46   # validator-enforced
  language_default: hi
  max_questions_per_call: 10        # hard cap
  target_questions_per_call: 6      # design target
  stop_when_candidates_lte: 5

# Global keys. Available at EVERY node, never redefined per question.
# LOCKED by the team, 8 Aug 2026. Changing these means re-recording audio,
# updating the validator and updating GUIDE.md. Treat as frozen.
#   0  main menu   -> jump back to language selection, wipe answers
#   *  repeat      -> replay whatever was just said (question OR answer)
#   #  back        -> undo the last answer, re-ask the previous question
controls:
  "0": {action: main_menu, hi: "Mukhya menu ke liye zero dabaiye.", en: "Press zero for the main menu."}
  "*": {action: repeat,    hi: "Dobara sunne ke liye star dabaiye.", en: "Press star to hear it again."}
  "#": {action: back,      hi: "Pichhle sawaal ke liye hash dabaiye.", en: "Press hash for the previous question."}

# Silence ladder. Total budget 30 seconds, then end politely.
silence_ladder:
  - {at: 5,  action: nudge_short,  hi: "Suniye, koi button dabaiye."}
  - {at: 15, action: two_options,  hi: "Do vikalp hain. Pehle vikalp ke liye 1 dabaiye. Doosre vikalp ke liye 2 dabaiye."}
  - {at: 25, action: are_you_there, hi: "Kya aap line par hain?"}
  - {at: 30, action: end_politely, hi: "Dhanyavaad. Phir call kijiye."}

# Speech policy. Speech is a convenience, buttons are the contract.
# Two failed speech attempts at ANY node and that node drops to buttons only
# for the rest of the call. We never ask a third time.
speech_policy:
  max_speech_attempts: 2
  on_unclear:
    hi: "Mujhe samajh nahi aaya. Dobara boliye."
    en: "I did not understand. Please say that again."
  after_max:
    action: force_dtmf
    hi: "Koi baat nahi. Button se kariye."
    en: "No problem. Please use the buttons."
  min_confidence: 0.6      # below this, treat as unclear. Never guess.

# Wrong / unmapped button. Distinct from silence and from unclear speech.
invalid_policy:
  max_invalid: 3
  on_invalid:
    hi: "Yeh button sahi nahi hai."
    en: "That is not a valid option."
  then: replay_options      # re-read only the options, not the whole question
  on_max_invalid:
    action: force_first_option_menu
    hi: "Chaliye, aasaan karte hain. Sirf do vikalp suniye."

defaults:
  collect: {digits: 1, speech: true}
  timeouts: silence_ladder
  barge_in: true

questions:

# ===========================================================================
# LAYER 0 — SESSION (2). Always asked, in this order, before anything else.
#
# Q001_LANGUAGE IS GONE (was here, was the root). It asked the caller to
# choose Hindi / English / both, and it was the wrong question to open on:
#   - Option 3 ("hinglish") was never implemented. _prompt_text() only ever
#     branched on "en", so pressing 3 silently behaved as Hindi. A dead
#     option on the very first prompt of every call.
#   - It cost a whole turn out of a 6-turn budget to ask something we can
#     answer for the caller.
#   - It could not accept speech at all (chicken-and-egg: no ASR language
#     chosen yet), so every caller had to start with a keypress.
# The system now has ONE fixed voice: Hindi narration in Roman script,
# with English left in place where English is what people say (scheme
# names, "business", "training"). That is what the prompts below already
# were, and what Sarvam's bulbul:v3 already voices correctly - so this
# removes a question rather than adding a translation layer.
# ===========================================================================
- id: Q002_INTENT
  layer: session
  writes: intent
  requires: always
  gain: 10
  why: "Splits the call into three completely different subgraphs. Highest-value branch in the system."
  tags: [session, mandatory, router]
  say_key: q002_intent
  prompt_hi: "Namaste. Agar aapko yojna ka naam pata hai to 1 dabaiye. Apne liye yojna dhoondhni hai to 2 dabaiye. Kisi kaam ke liye madad chahiye to 3 dabaiye."
  prompt_en: "Hello. If you know the scheme name, press 1. To find schemes for you, press 2. For help with a specific need, press 3."
  dtmf:
    "1": {set: {intent: known_scheme}, hi: "Naam pata hai", en: "I know the name"}
    "2": {set: {intent: find_for_me}, hi: "Meri yojna dhoondho", en: "Find schemes for me"}
    "3": {set: {intent: by_purpose}, hi: "Kaam ke hisaab se", en: "By purpose"}
  speech_intents: [KNOWN_SCHEME, FIND_FOR_ME, BY_PURPOSE, UNKNOWN]
  # Inherited from Q001_LANGUAGE, which used to be the root and carried
  # this. TEST_CASES.md D7 is a BLOCKER: hesitating at the very first
  # prompt must never end the call, because the caller then hangs up
  # having heard no scheme at all - the worst possible outcome. Whichever
  # question is the root has to own that guarantee, so it moved here with
  # the root. find_for_me is the safe default: it is the branch that asks
  # questions and always reaches a result.
  on_timeout:
    action: default
    set: {intent: find_for_me}
    hi: "Koi baat nahi, main aapke liye yojna dhoondhta hoon."

- id: Q003_ON_BEHALF
  layer: session
  writes: on_behalf
  requires: "intent in ['find_for_me','by_purpose']"
  gain: 3
  why: "PRD §3.2 C3. Answers are about the beneficiary, not the handset holder. Cheap to ask, prevents a whole class of wrong results."
  tags: [session, cheap]
  say_key: q003_on_behalf
  prompt_hi: "Yeh jaankari apne liye hai to 1, kisi aur ke liye to 2."
  prompt_en: "Press 1 if this is for you, 2 if for someone else."
  dtmf:
    "1": {set: {on_behalf: self}, hi: "Apne liye", en: "For me"}
    "2": {set: {on_behalf: other}, hi: "Kisi aur ke liye", en: "For someone else"}

# ===========================================================================
# LAYER 1 — PERSONA (5). Broad identity routing, orthogonal to scheme theme.
# Kept from v2 - genuinely useful and does not conflict with the real
# catalogue. Reduced from v2's 9 (dropped GST/turnover/vending-cert
# sub-branches - see LAYER 3, they are replaced by catalogue-grounded
# business attributes with better hit rates).
# ===========================================================================
- id: Q003B_PERSONA
  layer: persona
  writes: persona
  requires: "intent in ['find_for_me','by_purpose']"
  gain: 8
  why: "Determines the broad identity of the caller. Cheap and trivially answerable, sets tone for later prompts."
  tags: [persona, high_gain, router]
  say_key: q003b_persona
  prompt_hi: "Aap kya karte hain? Vyapar ya dukaan ke liye 1 dabaiye. Bunkar ya karigar ke liye 2 dabaiye. Machhli palan ke liye 3 dabaiye. Kisan ke liye 4 dabaiye. Naukri ya kuch aur ke liye 5 dabaiye."
  prompt_en: "What is your work? For business or shop, press 1. For weaver or artisan, press 2. For fishing, press 3. For farmer, press 4. For salaried or other, press 5."
  dtmf:
    "1": {set: {persona: business}, hi: "Vyapar", en: "Business"}
    "2": {set: {persona: artisan}, hi: "Bunkar", en: "Artisan"}
    "3": {set: {persona: fisher}, hi: "Machhli palan", en: "Fisher"}
    "4": {set: {persona: farmer}, hi: "Kisan", en: "Farmer"}
    "5": {set: {persona: other}, hi: "Anya", en: "Other"}
  speech_intents: [PR_BUSINESS, PR_ARTISAN, PR_FISHER, PR_FARMER, PR_OTHER, UNKNOWN]

- id: Q003C_APPLICANT_TYPE
  layer: persona
  writes: applicant_type
  requires: "persona is answered"
  gain: 10
  why: "CHANGE_REPORT #5: highest-information question available. Splits the catalogue business 31 / person 26 / both 43, and every caller knows the answer instantly."
  tags: [persona, high_gain, router]
  say_key: q003c_applicant_type
  prompt_hi: "Yeh jaankari ek dukaan ya udyog ke liye chahiye 1, ek vyakti ke liye 2, ya dono ho sakta hai 3?"
  prompt_en: "Is this for a business or shop 1, an individual 2, or could be either 3?"
  dtmf:
    "1": {set: {applicant_type: business}, hi: "Udyog", en: "Business"}
    "2": {set: {applicant_type: person}, hi: "Vyakti", en: "Individual"}
    "3": {set: {applicant_type: both}, hi: "Dono ho sakta hai", en: "Either"}

- id: Q003D_STUDENT
  layer: persona
  writes: is_student
  requires: "persona == 'other'"
  gain: 5
  why: "Scholarship and coaching schemes (LAYER 6 welfare) are a real slice of the welfare theme; catches students who don't fit the other four personas."
  tags: [persona, education]
  say_key: q003d_student
  prompt_hi: "Kya aap student hain? Haan 1, nahi 2."
  prompt_en: "Are you a student? Yes 1, No 2."
  dtmf:
    "1": {set: {is_student: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {is_student: "no"}, hi: "Nahi", en: "No"}

# ===========================================================================
# LAYER 2 — THEME (1). The single strongest narrowing question.
# Replaces v1/v2's `purpose` menu (income_support/crop_insurance/pension/...)
# with the ACTUAL 6-theme menu from scripts/ingest.py, which is what the
# menu navigator (Step 6) will present and what scheme_no dial codes are
# built from. Options match ingest.py THEMES exactly, in real-volume order.
# ===========================================================================
- id: Q004_THEME
  layer: purpose
  writes: theme
  requires: "applicant_type is answered and intent == 'by_purpose'"
  gain: 10
  why: "Cuts the 100-scheme catalogue by real theme volume (business 52, craft 13, fisheries 9, training 10, farming 6, welfare 10). Matches the menu navigator exactly, so a caller who narrows here lands on the same option they would have dialled directly."
  tags: [purpose, high_gain, router]
  say_key: q004_theme
  prompt_hi: "Vyapar, udyog ya dukaan ke liye 1 dabaiye. Bunkar, coir ya dastkari ke liye 2 dabaiye. Machhli palan ya nauka ke liye 3 dabaiye. Prashikshan ya rozgar ke liye 4 dabaiye. Kheti ya baagwani ke liye 5 dabaiye. Pension, madad ya padhai ke liye 6 dabaiye."
  prompt_en: "For business, industry or shop, press 1. For handloom, coir or handicraft, press 2. For fisheries or boats, press 3. For training or employment, press 4. For farming or horticulture, press 5. For pension, relief or study, press 6."
  dtmf:
    "1": {set: {theme: business}, hi: "Vyapar", en: "Business"}
    "2": {set: {theme: craft}, hi: "Bunkar", en: "Craft"}
    "3": {set: {theme: fisheries}, hi: "Machhli palan", en: "Fisheries"}
    "4": {set: {theme: training}, hi: "Prashikshan", en: "Training"}
    "5": {set: {theme: farming}, hi: "Kheti", en: "Farming"}
    "6": {set: {theme: welfare}, hi: "Pension madad", en: "Welfare"}
  speech_intents: [TH_BUSINESS, TH_CRAFT, TH_FISHERIES, TH_TRAINING, TH_FARMING, TH_WELFARE, UNKNOWN]

# ===========================================================================
# LAYER 3 — BUSINESS ATTRIBUTES (7). Replaces v2's GST/turnover sub-branch.
# Grounded in real eligibility-text frequency (Step 2 build notes):
# investment/plant-machinery ceilings hit 18/100, employment_created 18/100,
# enterprise_type (mfg vs service) 14/100, new-vs-existing unit 14/100,
# category-reserved (SC/ST/women) business rows 7/100. GST and turnover
# (v2's questions) each hit ~1/100 and are dropped.
# ===========================================================================
- id: Q020_ENTERPRISE_TYPE
  layer: business
  writes: enterprise_type
  requires: "theme == 'business' or applicant_type == 'business'"
  gain: 8
  why: "Manufacturing vs service-sector MSME rows use different subsidy schedules in this catalogue; 14/100 schemes gate on this directly."
  tags: [business, high_gain]
  say_key: q020_enterprise_type
  prompt_hi: "Udyog kis tarah ka hai? Utpadan ke liye 1 dabaiye. Sewa ke liye 2 dabaiye. Dono ke liye 3 dabaiye."
  prompt_en: "What kind of enterprise? For manufacturing, press 1. For service, press 2. For both, press 3."
  dtmf:
    "1": {set: {enterprise_type: manufacturing}, hi: "Utpadan", en: "Manufacturing"}
    "2": {set: {enterprise_type: service}, hi: "Sewa", en: "Service"}
    "3": {set: {enterprise_type: both}, hi: "Dono", en: "Both"}

- id: Q021_UNIT_STAGE
  layer: business
  writes: unit_stage
  requires: "theme == 'business' or applicant_type == 'business'"
  gain: 7
  why: "New-unit capital subsidies and existing-unit expansion/interest schemes are mutually exclusive in this catalogue; 14/100 rows name one or the other explicitly."
  tags: [business, high_gain]
  say_key: q021_unit_stage
  prompt_hi: "Naya udyog shuru karna hai 1, ya pehle se chal raha hai 2?"
  prompt_en: "Starting a new unit 1, or is it already running 2?"
  dtmf:
    "1": {set: {unit_stage: new}, hi: "Naya", en: "New"}
    "2": {set: {unit_stage: existing}, hi: "Chal raha hai", en: "Existing"}

- id: Q022_INVESTMENT_SIZE
  layer: business
  writes: investment_size
  requires: "theme == 'business' or applicant_type == 'business'"
  gain: 7
  why: "Plant-and-machinery / fixed-capital investment ceilings decide MSME-vs-larger-unit eligibility on 18/100 rows - the single most common hard number in the business eligibility text."
  tags: [business, banded, high_gain]
  say_key: q022_investment
  prompt_hi: "Machine ya udyog mein kitna paisa laga hai ya lagega? 25 lakh se kam ke liye 1 dabaiye. 25 lakh se 5 crore ke liye 2 dabaiye. 5 crore se zyada ke liye 3 dabaiye. Pata nahi to 4 dabaiye."
  prompt_en: "Investment in machinery or the unit? For under 25 lakh, press 1. For 25 lakh to 5 crore, press 2. For over 5 crore, press 3. If not sure, press 4."
  dtmf:
    "1": {set: {investment_size: lt25l}, hi: "25L se kam", en: "Under 25L"}
    "2": {set: {investment_size: "25l_5cr"}, hi: "25L-5Cr", en: "25L-5Cr"}
    "3": {set: {investment_size: gt5cr}, hi: "5Cr se zyada", en: "Over 5Cr"}
    "4": {set: {investment_size: unknown}, hi: "Pata nahi", en: "Not sure"}

- id: Q023_EMPLOYMENT_CREATED
  layer: business
  writes: employment_created
  requires: "unit_stage is answered"
  gain: 6
  why: "18/100 business schemes condition benefit or eligibility on jobs the unit creates or employs - a recurring clause, not a rare one."
  tags: [business, banded]
  say_key: q023_employment
  prompt_hi: "Kitne logon ko naukri di hai ya denge? Koi nahi to 1 dabaiye. Ek se paanch ke liye 2 dabaiye. Paanch se zyada ke liye 3 dabaiye."
  prompt_en: "How many people employed or will be employed? For none, press 1. For one to five, press 2. For more than five, press 3."
  dtmf:
    "1": {set: {employment_created: none}, hi: "Koi nahi", en: "None"}
    "2": {set: {employment_created: "1_5"}, hi: "1-5", en: "1-5"}
    "3": {set: {employment_created: gt5}, hi: "5 se zyada", en: "Over 5"}

- id: Q024_IS_REGISTERED_FIRM
  layer: business
  writes: is_registered_firm
  requires: "theme == 'business' or applicant_type == 'business'"
  gain: 5
  why: "Distinguishes a proprietorship/individual applicant from a registered firm, society or company - several schemes require one or the other explicitly."
  tags: [business, documents]
  say_key: q024_registered_firm
  prompt_hi: "Udyog register hai jaise company, firm ya society? Haan 1, nahi 2."
  prompt_en: "Is the enterprise registered, e.g. as a company, firm or society? Yes 1, No 2."
  dtmf:
    "1": {set: {is_registered_firm: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {is_registered_firm: "no"}, hi: "Nahi", en: "No"}

- id: Q025_UDYAM_REGISTERED
  layer: business
  writes: udyam_registered
  requires: "is_registered_firm == 'yes'"
  gain: 4
  why: "MSME/Udyam registration is a precondition for several MSME-specific subsidy lines; late in the branch since it only applies to already-registered units."
  tags: [business, documents]
  say_key: q025_udyam
  prompt_hi: "Udyam registration hua hai? Haan 1, nahi 2, pata nahi 3."
  prompt_en: "Is it Udyam-registered? Yes 1, No 2, Don't know 3."
  dtmf:
    "1": {set: {udyam_registered: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {udyam_registered: "no"}, hi: "Nahi", en: "No"}
    "3": {set: {udyam_registered: unknown}, hi: "Pata nahi", en: "Don't know"}

- id: Q026_LOAN_TAKEN
  layer: business
  writes: loan_taken
  requires: "theme == 'business' or applicant_type == 'business'"
  gain: 5
  why: "Interest-subsidy and waiver schemes require an existing loan; capital-subsidy schemes often exclude applicants who already borrowed for the same purpose. 20/100 rows reference loan status."
  tags: [business, credit]
  say_key: q026_loan_taken
  prompt_hi: "Udyog ke liye bank se karza liya hai? Haan 1, nahi 2."
  prompt_en: "Have you taken a bank loan for the business? Yes 1, No 2."
  dtmf:
    "1": {set: {loan_taken: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {loan_taken: "no"}, hi: "Nahi", en: "No"}

# ===========================================================================
# LAYER 4 — CRAFT / FISHERIES ATTRIBUTES (6). Both themes are dominated by
# individual-craftsperson-or-society and boat/coop-membership eligibility
# text (see Step 2 build notes). Generic land/crop/livestock questions from
# v1/v2 do not apply here at all - dropped.
# ===========================================================================
- id: Q030_SOCIETY_OR_INDIVIDUAL
  layer: craft_fisheries
  writes: applies_as
  requires: "theme in ['craft','fisheries']"
  gain: 7
  why: "A real split in both themes: several rows require a registered cooperative society or agency, others an individual craftsperson or boat owner. Wrong branch wastes the whole call."
  tags: [craft, fisheries, high_gain, router]
  say_key: q030_society_individual
  prompt_hi: "Aap akele aavedan kar rahe hain 1, ya kisi samiti ya society ki taraf se 2?"
  prompt_en: "Applying as an individual 1, or on behalf of a society or cooperative 2?"
  dtmf:
    "1": {set: {applies_as: individual}, hi: "Akele", en: "Individual"}
    "2": {set: {applies_as: society}, hi: "Samiti", en: "Society"}

- id: Q031_COOP_MEMBER
  layer: craft_fisheries
  writes: coop_member
  requires: "theme in ['craft','fisheries'] and applies_as == 'individual'"
  gain: 6
  why: "9/100 rows (mostly fisheries) require cooperative-society membership as a soft eligibility signal even for individual applicants."
  tags: [craft, fisheries]
  say_key: q031_coop_member
  prompt_hi: "Kisi sahakari samiti ke sadasya hain? Haan 1, nahi 2."
  prompt_en: "Are you a member of a cooperative society? Yes 1, No 2."
  dtmf:
    "1": {set: {coop_member: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {coop_member: "no"}, hi: "Nahi", en: "No"}

- id: Q032_BOAT_OWNER
  layer: craft_fisheries
  writes: boat_owner
  requires: "theme == 'fisheries'"
  gain: 7
  why: "Boat/vessel ownership or registration gates the boat-conversion, insurance-premium and reactivation schemes - roughly half the fisheries theme."
  tags: [fisheries, high_gain]
  say_key: q032_boat_owner
  prompt_hi: "Aapke paas machhli pakadne ki naav hai? Haan 1, nahi 2."
  prompt_en: "Do you own a fishing boat? Yes 1, No 2."
  dtmf:
    "1": {set: {boat_owner: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {boat_owner: "no"}, hi: "Nahi", en: "No"}

- id: Q033_CRAFT_TYPE
  layer: craft_fisheries
  writes: craft_type
  requires: "theme == 'craft'"
  gain: 5
  why: "Coir, handloom and general handicraft schemes are separately administered bodies in this catalogue; the caller's craft decides which body applies."
  tags: [craft]
  say_key: q033_craft_type
  prompt_hi: "Kaunsa kaam karte hain? Bunai ya handloom ke liye 1 dabaiye. Coir ke liye 2 dabaiye. Anya dastkari ke liye 3 dabaiye."
  prompt_en: "What kind of craft? For weaving or handloom, press 1. For coir, press 2. For other handicraft, press 3."
  dtmf:
    "1": {set: {craft_type: handloom}, hi: "Bunai", en: "Handloom"}
    "2": {set: {craft_type: coir}, hi: "Coir", en: "Coir"}
    "3": {set: {craft_type: other}, hi: "Anya", en: "Other"}

- id: Q034_LITERATE
  layer: craft_fisheries
  writes: is_literate
  requires: "theme == 'craft' and applies_as == 'individual'"
  gain: 3
  why: "At least one craft scheme states literacy as an explicit condition; cheap to ask, avoids a late rejection."
  tags: [craft, low_gain]
  say_key: q034_literate
  prompt_hi: "Kya aap padhna likhna jaante hain? Haan 1, nahi 2."
  prompt_en: "Can you read and write? Yes 1, No 2."
  dtmf:
    "1": {set: {is_literate: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {is_literate: "no"}, hi: "Nahi", en: "No"}

- id: Q035_YEARS_IN_TRADE
  layer: craft_fisheries
  writes: years_in_trade_band
  requires: "theme in ['craft','fisheries'] and applies_as == 'individual'"
  gain: 4
  why: "Several exhibition, award and reactivation schemes require a minimum number of years in the trade (e.g. 3-year exhibition participation clause)."
  tags: [craft, fisheries]
  say_key: q035_years_trade
  prompt_hi: "Kitne saal se yeh kaam kar rahe hain? Teen saal se kam ke liye 1 dabaiye. Teen saal ya zyada ke liye 2 dabaiye."
  prompt_en: "How long in this trade? For under 3 years, press 1. For 3 years or more, press 2."
  dtmf:
    "1": {set: {years_in_trade_band: lt3y}, hi: "3 saal se kam", en: "Under 3y"}
    "2": {set: {years_in_trade_band: gte3y}, hi: "3 saal ya zyada", en: "3y+"}

# ===========================================================================
# LAYER 5 — TRAINING (3). Real training-theme rows are craft/industry-linked
# skill programmes (coir, silk, industrial trades) plus a couple of pure
# scholarship/coaching schemes, not generic youth skilling. Kept short.
# ===========================================================================
- id: Q040_TRAINING_LINKED_TRADE
  layer: training
  writes: training_related
  requires: "theme == 'training'"
  gain: 6
