    "1": {set: {_status_query: "yes"}, hi: "Haan", en: "Yes", next: WRAP_UP}
    "2": {set: {_status_query: "no"}, hi: "Nahi", en: "No"}

# ===========================================================================
# LAYER 13 — KNOWN-SCHEME BRANCH (4). intent == known_scheme skips everything above.
# ===========================================================================
- id: Q120_SCHEME_NAME
  layer: known_scheme
  writes: _named_scheme
  requires: "intent == 'known_scheme'"
  gain: 10
  why: "Short-circuits the entire narrowing loop. One speech turn replaces six DTMF turns."
  tags: [known_scheme, speech_primary]
  say_key: q120_scheme_name
  prompt_hi: "Yojna ka naam boliye."
  prompt_en: "Say the scheme name."
  # SPEECH IS THE POINT HERE. A scheme name cannot be typed on a keypad.
  # Two attempts maximum, then we stop asking and switch to the category menu.
  collect: {digits: 0, speech: true}
  speech_intents: [SCHEME_NAME, UNKNOWN]
  speech_attempts: 2
  on_unclear:
    hi: "Mujhe samajh nahi aaya. Yojna ka naam dobara boliye."
    en: "I did not understand. Please say the scheme name again."
  after_max_speech:
    next: Q121_SCHEME_CATEGORY
    hi: "Koi baat nahi. Button se dhoondhte hain."
  # NEVER accept a spoken name without reading it back. This is the single
  # guard against announcing a scheme the caller never asked for.
  on_match: {next: Q120B_CONFIRM_SCHEME}
  on_unknown: {next: Q121_SCHEME_CATEGORY}

- id: Q120B_CONFIRM_SCHEME
  layer: known_scheme
  writes: _scheme_confirmed
  requires: "_named_scheme is answered"
  gain: 9
  why: "Reads the matched scheme and its benefit back before committing, so a misheard name is caught by the caller and never by the demo audience."
  tags: [known_scheme, confirmation, safety]
  say_key: q120b_confirm
  # Template. {name_short_hi} and {benefit_one_line} come from the DB row,
  # never from the model. If the row has no benefit_one_line, say the name only.
  prompt_hi: "Aap {name_short_hi} ki baat kar rahe hain. Isme {benefit_one_line}. Sahi hai to 1 dabaiye. Nahi to 2 dabaiye."
  prompt_en: "You mean {name_short_hi}. It gives {benefit_one_line}. Press 1 if correct, 2 if not."
  speech_intents: [YES, NO, UNKNOWN]
  dtmf:
    "1": {set: {_scheme_confirmed: "yes"}, hi: "Sahi hai", en: "Correct"}
    "2": {set: {_scheme_confirmed: "no"},  hi: "Nahi", en: "No", next: Q120_SCHEME_NAME}
  # Second miss on the same name means our matcher is wrong, not the caller.
  # Do not loop a third time - go to the category menu.
  on_second_no: {next: Q121_SCHEME_CATEGORY}

- id: Q121_SCHEME_CATEGORY
  layer: known_scheme
  writes: purpose
  requires: "intent == 'known_scheme' and _named_scheme == 'UNKNOWN'"
  gain: 7
  why: "Fallback when ASR cannot resolve the spoken name. Never guess a scheme; narrow by category instead."
  tags: [known_scheme, fallback]
  say_key: q121_scheme_category
  prompt_hi: "Naam samajh nahi aaya. Kis tarah ki yojna? Paisa 1. Beema 2. Karza 3. Subsidy 4. Pension 5."
  prompt_en: "Didn't catch that. What kind of scheme? Money 1. Insurance 2. Loan 3. Subsidy 4. Pension 5."
  dtmf:
    "1": {set: {purpose: income_support}, hi: "Paisa", en: "Money"}
    "2": {set: {purpose: crop_insurance}, hi: "Beema", en: "Insurance"}
    "3": {set: {purpose: credit_loan}, hi: "Karza", en: "Loan"}
    "4": {set: {purpose: equipment_subsidy}, hi: "Subsidy", en: "Subsidy"}
    "5": {set: {purpose: pension}, hi: "Pension", en: "Pension"}

- id: Q122_WHICH_FIELD
  layer: known_scheme
  writes: _field_wanted
  requires: "_named_scheme is answered and _named_scheme != 'UNKNOWN'"
  gain: 8
  why: "When the scheme is known, the only remaining question is which field to read. One turn to the answer."
  tags: [known_scheme, detail]
  say_key: q122_which_field
  prompt_hi: "Kya jaanna hai? Patrata 1. Kaagaz 2. Kahan aavedan 3. Aakhri tareekh 4. Fayda 5."
  prompt_en: "What do you need? Eligibility 1. Documents 2. Where to apply 3. Deadline 4. Benefit 5."
  dtmf:
    "1": {set: {_field_wanted: eligibility}, hi: "Patrata", en: "Eligibility"}
    "2": {set: {_field_wanted: documents}, hi: "Kaagaz", en: "Documents"}
    "3": {set: {_field_wanted: where_to_apply}, hi: "Kahan", en: "Where"}
    "4": {set: {_field_wanted: deadline}, hi: "Tareekh", en: "Deadline"}
    "5": {set: {_field_wanted: benefit}, hi: "Fayda", en: "Benefit"}

- id: Q123_ELIGIBILITY_CHECK
  layer: known_scheme
  writes: _wants_eligibility_check
  requires: "_field_wanted == 'eligibility'"
  gain: 6
  why: "Offers to run the narrowing loop against one named scheme instead of the whole catalogue. Re-enters the DAG with a much smaller frontier."
  tags: [known_scheme, bridge]
  say_key: q123_elig_check
  prompt_hi: "Kya main jaanch loon ki aap patra hain? Haan 1, nahi 2."
  prompt_en: "Shall I check whether you qualify? Yes 1, No 2."
  dtmf:
    "1": {set: {_wants_eligibility_check: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {_wants_eligibility_check: "no"}, hi: "Nahi", en: "No"}