# KisanSetu Voice — Question Bank v1  (90 questions)
# ---------------------------------------------------------------------------
# This file is DATA, not code. The engine reads it; the LLM never edits it.
#
# Contract:
#   - Every question writes exactly ONE attribute from attribute_schema.sql.
#   - `requires` is a boolean expression over answered attributes. If it does
#     not evaluate TRUE, the question is NOT askable. This is the DAG edge.
#   - `gain` is a static prior (1-10) used only to break ties before any
#     answers exist. After turn 1 the engine computes real information gain
#     from the live candidate set and `gain` is ignored.
#   - DTMF answers use keys 1-9 ONLY. 0, * and # are globally reserved.
#   - `speech: true` at every node (PRD §3.1, audio-overrides-buttons).
# ---------------------------------------------------------------------------

meta:
  version: 1
  question_count: 90   # validator-enforced
  language_default: hi
  max_questions_per_call: 10        # hard cap
  target_questions_per_call: 6      # design target
  stop_when_candidates_lte: 5

# Global keys. Available at EVERY node, never redefined per question.
# LOCKED by the team, 8 Aug 2026. Changing these means re-recording audio,
# updating the validator and updating GUIDE.md. Treat as frozen.
#   0  main menu   -> jump back to language selection, wipe answers
#   *  repeat      -> replay whatever was just said (question OR answer)
#   #  back        -> undo the last answer, re-ask the previous question
controls:
  "0": {action: main_menu, hi: "mukhya menu ke liye zero", en: "press zero for the main menu"}
  "*": {action: repeat,    hi: "dobara sunne ke liye star", en: "press star to hear it again"}
  "#": {action: back,      hi: "pichhle sawaal ke liye hash", en: "press hash for the previous question"}

# Silence ladder. Total budget 30 seconds, then end politely.
silence_ladder:
  - {at: 5,  action: nudge_short,  hi: "Suniye, koi button dabaiye."}
  - {at: 15, action: two_options,  hi: "Do vikalp hain. Pehle ke liye 1, doosre ke liye 2."}
  - {at: 25, action: are_you_there, hi: "Kya aap line par hain?"}
  - {at: 30, action: end_politely, hi: "Dhanyavaad. Phir call kijiye."}

# Speech policy. Speech is a convenience, buttons are the contract.
# Two failed speech attempts at ANY node and that node drops to buttons only
# for the rest of the call. We never ask a third time.
speech_policy:
  max_speech_attempts: 2
  on_unclear:
    hi: "Mujhe samajh nahi aaya. Dobara boliye."
    en: "I did not understand. Please say that again."
  after_max:
    action: force_dtmf
    hi: "Koi baat nahi. Button se kariye."
    en: "No problem. Please use the buttons."
  min_confidence: 0.6      # below this, treat as unclear. Never guess.

# Wrong / unmapped button. Distinct from silence and from unclear speech.
invalid_policy:
  max_invalid: 3
  on_invalid:
    hi: "Yeh button sahi nahi hai."
    en: "That is not a valid option."
  then: replay_options      # re-read only the options, not the whole question
  on_max_invalid:
    action: force_first_option_menu
    hi: "Chaliye, aasaan karte hain. Sirf do vikalp suniye."

defaults:
  collect: {digits: 1, speech: true}
  timeouts: silence_ladder
  barge_in: true

questions:

# ===========================================================================
# LAYER 0 — SESSION (3). Always asked, in this order, before anything else.
# ===========================================================================
- id: Q001_LANGUAGE
  layer: session
  writes: language
  requires: always
  gain: 10
  why: "Sets TTS voice and prompt set for the whole call. Nothing can be said correctly before this."
  tags: [session, mandatory, first]
  say_key: q001_language
  # BUTTONS ONLY. No speech, no barge-in. We cannot run speech recognition
  # before we know which language to run it in - it is a chicken-and-egg.
  # This is the one node in the system where speech is switched off.
  collect: {digits: 1, speech: false}
  speech_disabled_reason: "Language not yet known; ASR model cannot be selected."
  barge_in: false
  prompt_hi: "Namaste. Hindi ke liye 1 dabaiye. For English, press 2. Hindi aur English dono ke liye 3 dabaiye."
  prompt_en: "Namaste. Hindi ke liye 1 dabaiye. For English, press 2. Hindi aur English dono ke liye 3 dabaiye."
  dtmf:
    "1": {set: {language: hi}, hi: "Hindi", en: "Hindi"}
    "2": {set: {language: en}, hi: "English", en: "English"}
    "3": {set: {language: hinglish}, hi: "Hindi aur English", en: "Hindi and English"}
  # Wrong button here is common - callers press 0 out of habit.
  # 0 is the main menu, and the main menu IS this question, so it self-heals.
  on_invalid:
    action: replay_options
    hi: "Sirf 1, 2 ya 3 dabaiye."
  on_max_invalid:
    action: default
    set: {language: hi}
    hi: "Hum Hindi mein aage badhte hain."
  on_timeout:
    action: default
    set: {language: hi}
    hi: "Hum Hindi mein aage badhte hain."

- id: Q002_INTENT
  layer: session
  writes: intent
  requires: "language is answered"
  gain: 10
  why: "Splits the call into three completely different subgraphs. Highest-value branch in the system."
  tags: [session, mandatory, router]
  say_key: q002_intent
  prompt_hi: "Kisi yojna ka naam pata hai to 1. Apne liye yojna dhoondhni hai to 2. Kisi kaam ke liye madad chahiye to 3."
  prompt_en: "Press 1 if you know the scheme name. 2 to find schemes for you. 3 for help with a specific need."
  dtmf:
    "1": {set: {intent: known_scheme}, hi: "Naam pata hai", en: "I know the name"}
    "2": {set: {intent: find_for_me}, hi: "Meri yojna dhoondho", en: "Find schemes for me"}
    "3": {set: {intent: by_purpose}, hi: "Kaam ke hisaab se", en: "By purpose"}
  speech_intents: [KNOWN_SCHEME, FIND_FOR_ME, BY_PURPOSE, UNKNOWN]

- id: Q003_ON_BEHALF
  layer: session
  writes: on_behalf
  requires: "intent in ['find_for_me','by_purpose']"
  gain: 3
  why: "PRD §3.2 C3. Answers are about the beneficiary, not the handset holder. Cheap to ask, prevents a whole class of wrong results."
  tags: [session, cheap]
  say_key: q003_on_behalf
  prompt_hi: "Yeh jaankari apne liye hai to 1, kisi aur ke liye to 2."
  prompt_en: "Press 1 if this is for you, 2 if for someone else."
  dtmf:
    "1": {set: {on_behalf: self}, hi: "Apne liye", en: "For me"}
    "2": {set: {on_behalf: other}, hi: "Kisi aur ke liye", en: "For someone else"}

# ===========================================================================
# LAYER 1 — PERSONA (9). Broad identity routing before purpose.
# ===========================================================================
- id: Q003B_PERSONA
  layer: persona
  writes: persona
  requires: "intent in ['find_for_me','by_purpose']"
  gain: 10
  why: "Determines the broad identity of the caller to trigger specific subgraphs (farmer, migrant, student, business, shopkeeper)."
  tags: [persona, high_gain, router]
  say_key: q003b_persona
  prompt_hi: "Aap kya karte hain? Kisan hain to 1. Prawasi mazdoor 2. Chhatra ya student 3. Bada vyapar 4. Chhoti dukaan 5."
  prompt_en: "What is your profession? Farmer 1. Migrant worker 2. Student 3. Business man 4. Shopkeeper 5."
  dtmf:
    "1": {set: {persona: farmer}, hi: "Kisan", en: "Farmer"}
    "2": {set: {persona: migrant}, hi: "Prawasi mazdoor", en: "Migrant worker"}
    "3": {set: {persona: student}, hi: "Student", en: "Student"}
    "4": {set: {persona: businessman}, hi: "Vyapar", en: "Business man"}
    "5": {set: {persona: shopkeeper}, hi: "Dukaan", en: "Shopkeeper"}
  speech_intents: [PR_FARMER, PR_MIGRANT, PR_STUDENT, PR_BUSINESS, PR_SHOP, UNKNOWN]

- id: Q003C_MIGRANT_REG
  layer: persona
  writes: migrant_registered
  requires: "persona == 'migrant'"
  gain: 8
  why: "e-Shram or BOCW registration unlocks major social security benefits for migrants."
  tags: [migrant, documents, high_gain]
  say_key: q003c_migrant_reg
  prompt_hi: "Kya aapka e-Shram ya mazdoor card bana hai? Haan 1, nahi 2."
  prompt_en: "Do you have an e-Shram or labour card? Yes 1, No 2."
  dtmf:
    "1": {set: {migrant_registered: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {migrant_registered: "no"}, hi: "Nahi", en: "No"}

- id: Q003D_MIGRANT_SECTOR
  layer: persona
  writes: migrant_sector
  requires: "persona == 'migrant'"
  gain: 7
  why: "Construction workers have separate cess-funded boards compared to general unorganized workers."
  tags: [migrant, sector]
  say_key: q003d_migrant_sector
  prompt_hi: "Aap kis tarah ka kaam karte hain? Nirman ya construction 1. Factory 2. Gharelu kaam 3. Anya 4."
  prompt_en: "What kind of work? Construction 1. Factory 2. Domestic work 3. Other 4."
  dtmf:
    "1": {set: {migrant_sector: construction}, hi: "Nirman", en: "Construction"}
    "2": {set: {migrant_sector: factory}, hi: "Factory", en: "Factory"}
    "3": {set: {migrant_sector: domestic}, hi: "Gharelu", en: "Domestic"}
    "4": {set: {migrant_sector: other}, hi: "Anya", en: "Other"}

- id: Q003E_STUDENT_LEVEL
  layer: persona
  writes: student_level
  requires: "persona == 'student'"
  gain: 9
  why: "Scholarship schemes strictly depend on the current education level."
  tags: [student, education, high_gain]
  say_key: q003e_student_level
  prompt_hi: "Aap abhi kis kaksha mein hain? School 1. College ya graduation 2. Post graduation 3. ITI ya diploma 4."
  prompt_en: "Current education level? School 1. College 2. Post-graduation 3. ITI or Diploma 4."
  dtmf:
    "1": {set: {student_level: school}, hi: "School", en: "School"}
    "2": {set: {student_level: college}, hi: "College", en: "College"}
    "3": {set: {student_level: postgrad}, hi: "Post grad", en: "Post-grad"}
    "4": {set: {student_level: diploma}, hi: "Diploma", en: "Diploma"}

- id: Q003F_STUDENT_HOSTEL
  layer: persona
  writes: student_hostel
  requires: "persona == 'student'"
  gain: 6
  why: "Hostel allowances and residential school schemes depend on this."
  tags: [student, housing]
  say_key: q003f_student_hostel
  prompt_hi: "Kya aap hostel mein rehte hain? Haan 1, nahi 2."
  prompt_en: "Do you live in a hostel? Yes 1, No 2."
  dtmf:
    "1": {set: {student_hostel: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {student_hostel: "no"}, hi: "Nahi", en: "No"}

- id: Q003G_BUSINESS_TURNOVER
  layer: persona
  writes: business_turnover
  requires: "persona == 'businessman'"
  gain: 8
  why: "MSME schemes heavily rely on turnover bands to determine eligibility."
  tags: [business, msme, banded]
  say_key: q003g_business_turnover
  prompt_hi: "Saalana turnover kitna hai? 40 lakh se kam 1. 40 lakh se 1.5 crore 2. 1.5 crore se zyada 3."
  prompt_en: "Annual turnover? Under 40 lakh 1. 40 lakh to 1.5 crore 2. Over 1.5 crore 3."
  dtmf:
    "1": {set: {business_turnover: lt40l}, hi: "40L se kam", en: "Under 40L"}
    "2": {set: {business_turnover: "40l_1_5cr"}, hi: "40L-1.5Cr", en: "40L to 1.5Cr"}
    "3": {set: {business_turnover: gt1_5cr}, hi: "1.5Cr se zyada", en: "Over 1.5Cr"}

- id: Q003H_BUSINESS_GST
  layer: persona
  writes: business_gst
  requires: "persona == 'businessman'"
  gain: 7
  why: "GST registration is mandatory for many formal credit and subsidy linkages."
  tags: [business, documents]
  say_key: q003h_business_gst
  prompt_hi: "Kya aapka GST registration hai? Haan 1, nahi 2."
  prompt_en: "Are you GST registered? Yes 1, No 2."
  dtmf:
    "1": {set: {business_gst: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {business_gst: "no"}, hi: "Nahi", en: "No"}

- id: Q003I_SHOP_TYPE
  layer: persona
  writes: shop_type
  requires: "persona == 'shopkeeper'"
  gain: 8
  why: "Differentiates PM SVANidhi (street vendors) from standard Mudra loans (fixed shops)."
  tags: [shopkeeper, credit, router]
  say_key: q003i_shop_type
  prompt_hi: "Dukaan kaisi hai? Rehri ya thela 1. Pakki dukaan 2. Gumti ya khokha 3."
  prompt_en: "Shop type? Street vendor 1. Fixed shop 2. Kiosk 3."
  dtmf:
    "1": {set: {shop_type: vendor}, hi: "Rehri thela", en: "Street vendor"}
    "2": {set: {shop_type: fixed}, hi: "Pakki dukaan", en: "Fixed shop"}
    "3": {set: {shop_type: kiosk}, hi: "Gumti", en: "Kiosk"}

- id: Q003J_SHOP_VENDING_CERT
  layer: persona
  writes: shop_vending_cert
  requires: "shop_type in ['vendor','kiosk']"
  gain: 6
  why: "Vending certificate is a precondition for PM SVANidhi disbursements."
  tags: [shopkeeper, documents]
  say_key: q003j_shop_vending_cert
  prompt_hi: "Kya nagar nigam se vending certificate mila hai? Haan 1, nahi 2."
  prompt_en: "Do you have a vending certificate from the municipality? Yes 1, No 2."
  dtmf:
    "1": {set: {shop_vending_cert: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {shop_vending_cert: "no"}, hi: "Nahi", en: "No"}

# ===========================================================================
# LAYER 2 — PURPOSE (1). The single strongest narrowing question.
# ===========================================================================
- id: Q004_PURPOSE
  layer: purpose
  writes: purpose
  requires: "persona is answered and intent == 'by_purpose'"
  gain: 10
  why: "Cuts a 100-scheme catalogue to roughly 8-20 in one turn. Nothing else in the bank comes close."
  tags: [purpose, high_gain, router]
  say_key: q004_purpose
  prompt_hi: "Paise ki madad ke liye 1. Fasal beema 2. Karza 3. Machine ya subsidy 4. Pension ya budhapa 5. Ghar, paani, bijli 6. Padhai ya training 7. Pashu ya dairy 8."
  prompt_en: "Income support 1. Crop insurance 2. Loan 3. Equipment subsidy 4. Pension 5. Housing and utilities 6. Education or training 7. Livestock or dairy 8."
  dtmf:
    "1": {set: {purpose: income_support}, hi: "Paise ki madad", en: "Income support"}
    "2": {set: {purpose: crop_insurance}, hi: "Fasal beema", en: "Crop insurance"}
    "3": {set: {purpose: credit_loan}, hi: "Karza", en: "Credit / loan"}
    "4": {set: {purpose: equipment_subsidy}, hi: "Machine subsidy", en: "Equipment subsidy"}
    "5": {set: {purpose: pension}, hi: "Pension", en: "Pension"}
    "6": {set: {purpose: housing_utilities}, hi: "Ghar aur suvidha", en: "Housing / utilities"}
    "7": {set: {purpose: education_skill}, hi: "Padhai ya training", en: "Education / skilling"}
    "8": {set: {purpose: livestock_allied}, hi: "Pashu ya dairy", en: "Livestock / allied"}
  speech_intents: [P_INCOME, P_INSURANCE, P_LOAN, P_EQUIPMENT, P_PENSION, P_HOUSING, P_EDUCATION, P_LIVESTOCK, UNKNOWN]

# ===========================================================================
# LAYER 3 — GEOGRAPHY (3). Two-step state pick: 36 states will not fit on 8 keys.
# ===========================================================================
- id: Q010_STATE_ZONE
  layer: geography
  writes: _state_zone
  requires: "persona is answered and intent in ['find_for_me','by_purpose']"
  gain: 9
  why: "State decides which state schemes are even in scope. Asked as zone-then-state because 36 states do not fit on 8 keys."
  tags: [geography, mandatory, two_step]
  say_key: q010_state_zone
  prompt_hi: "Uttar Bharat 1. Madhya Bharat 2. Purab aur Purvottar 3. Pashchim 4. Dakshin 5."
  prompt_en: "North 1. Central 2. East and North-East 3. West 4. South 5."
  dtmf:
    "1": {set: {_state_zone: north}, hi: "Uttar", en: "North"}
    "2": {set: {_state_zone: central}, hi: "Madhya", en: "Central"}
    "3": {set: {_state_zone: east}, hi: "Purab", en: "East / NE"}
    "4": {set: {_state_zone: west}, hi: "Pashchim", en: "West"}
    "5": {set: {_state_zone: south}, hi: "Dakshin", en: "South"}

- id: Q011_STATE_PICK
  layer: geography
  writes: state
  requires: "_state_zone is answered"
  gain: 9
  why: "Resolves the exact state within the chosen zone. Options are generated from the zone, not free-form."
  tags: [geography, mandatory, dynamic_options]
  say_key: q011_state_pick
  prompt_hi: "Apna rajya chuniye."
  prompt_en: "Choose your state."
  option_source: "states_by_zone[_state_zone]"   # max 8 per zone, engine-generated, PRE-RECORDED per zone
  speech_intents: [STATE_NAME, UNKNOWN]
  confirm_back: true

- id: Q012_AREA_TYPE
  layer: geography
  writes: area_type
  requires: "state is answered"
  gain: 6
  why: "Many schemes are rural-only or urban-only. One key, splits the catalogue meaningfully."
  tags: [geography, cheap]
  say_key: q012_area_type
  prompt_hi: "Gaon mein rehte hain to 1, shehar mein to 2."
  prompt_en: "Press 1 for village, 2 for town or city."
  dtmf:
    "1": {set: {area_type: rural}, hi: "Gaon", en: "Rural"}
    "2": {set: {area_type: urban}, hi: "Shehar", en: "Urban"}

# ===========================================================================
# LAYER 4 — OCCUPATION (6). The second router.
# ===========================================================================
- id: Q030_OCCUPATION
  layer: occupation
  writes: occupation
  requires: "state is answered"
  gain: 10
  why: "After purpose, the strongest single filter. Determines whether the land, crop, livestock or non-farm subgraph opens."
  tags: [occupation, high_gain, router]
  say_key: q030_occupation
  prompt_hi: "Kheti karte hain to 1. Khet mazdoori 2. Pashupalan ya dairy 3. Machhli palan 4. Dukaan ya dhandha 5. Bunkar ya karigar 6. Naukri 7. Kuch aur 8."
  prompt_en: "Farming 1. Farm labour 2. Livestock or dairy 3. Fishing 4. Shop or business 5. Weaver or artisan 6. Salaried 7. Something else 8."
  dtmf:
    "1": {set: {occupation: farmer}, hi: "Kheti", en: "Farmer"}
    "2": {set: {occupation: agri_labour}, hi: "Khet maz मजदूर", en: "Farm labour"}
    "3": {set: {occupation: livestock}, hi: "Pashupalan", en: "Livestock"}
    "4": {set: {occupation: fisher}, hi: "Machhli palan", en: "Fisher"}
    "5": {set: {occupation: business}, hi: "Dhandha", en: "Business"}
    "6": {set: {occupation: artisan}, hi: "Karigar", en: "Artisan"}
    "7": {set: {occupation: salaried}, hi: "Naukri", en: "Salaried"}
    "8": {set: {occupation: other}, hi: "Kuch aur", en: "Other"}
  speech_intents: [OCC_FARMER, OCC_LABOUR, OCC_LIVESTOCK, OCC_FISHER, OCC_BUSINESS, OCC_ARTISAN, OCC_SALARIED, OCC_OTHER, UNKNOWN]

- id: Q031_AGRI_ROLE
  layer: occupation
  writes: agri_role
  requires: "occupation in ['farmer','agri_labour']"
  gain: 8
  why: "Tenant and sharecropper farmers are excluded from most land-linked schemes. This one answer prevents the worst false positive we can produce."
  tags: [occupation, land, disqualifier]
  say_key: q031_agri_role
  prompt_hi: "Apni zameen par kheti 1. Batai ya theke par 2. Dusre ke khet mein mazdoori 3."
  prompt_en: "Own land 1. Leased or sharecropped 2. Labour on others' land 3."
  dtmf:
    "1": {set: {agri_role: owner}, hi: "Apni zameen", en: "Owner"}
    "2": {set: {agri_role: tenant}, hi: "Batai", en: "Tenant"}
    "3": {set: {agri_role: labour}, hi: "Mazdoori", en: "Labour"}

- id: Q032_ALLIED_ACTIVITY
  layer: occupation
  writes: allied_activity
  requires: "occupation in ['livestock','fisher'] or purpose == 'livestock_allied'"
  gain: 7
  why: "Allied schemes are activity-specific; dairy rules never apply to beekeeping."
  tags: [occupation, allied]
  say_key: q032_allied
  prompt_hi: "Gaay ya bhains 1. Bakri ya bhed 2. Murgi palan 3. Machhli 4. Madhumakhi 5. Sooar 6."
  prompt_en: "Cattle 1. Goat or sheep 2. Poultry 3. Fish 4. Beekeeping 5. Piggery 6."
  dtmf:
    "1": {set: {allied_activity: dairy}, hi: "Gaay bhains", en: "Dairy"}
    "2": {set: {allied_activity: smallruminant}, hi: "Bakri bhed", en: "Goat / sheep"}
    "3": {set: {allied_activity: poultry}, hi: "Murgi", en: "Poultry"}
    "4": {set: {allied_activity: fishery}, hi: "Machhli", en: "Fishery"}
    "5": {set: {allied_activity: apiary}, hi: "Madhumakhi", en: "Apiary"}
    "6": {set: {allied_activity: piggery}, hi: "Sooar", en: "Piggery"}

- id: Q033_NONFARM_TRADE
  layer: occupation
  writes: nonfarm_trade
  requires: "occupation in ['business','artisan']"
  gain: 6
  why: "Opens the MSME / PM Vishwakarma / street vendor subgraph, which shares nothing with the farm subgraph."
  tags: [occupation, nonfarm]
  say_key: q033_nonfarm
  prompt_hi: "Chhoti dukaan 1. Rehri patri 2. Bunai ya kadhai 3. Lohar, badhai, kumhar 4. Chhota udyog 5."
  prompt_en: "Small shop 1. Street vendor 2. Weaving 3. Traditional craft 4. Micro enterprise 5."
  dtmf:
    "1": {set: {nonfarm_trade: shop}, hi: "Dukaan", en: "Shop"}
    "2": {set: {nonfarm_trade: vendor}, hi: "Rehri", en: "Street vendor"}
    "3": {set: {nonfarm_trade: weaver}, hi: "Bunkar", en: "Weaver"}
    "4": {set: {nonfarm_trade: craft}, hi: "Karigar", en: "Craft"}
    "5": {set: {nonfarm_trade: micro}, hi: "Chhota udyog", en: "Micro enterprise"}

- id: Q034_IS_MIGRANT
  layer: occupation
  writes: is_migrant
  requires: "occupation in ['agri_labour','other']"
  gain: 4
  why: "Unlocks the migrant-worker welfare cluster and portable ration entitlements, which no other question in the bank can reach."
  tags: [occupation, welfare]
  say_key: q034_migrant
  prompt_hi: "Kaam ke liye dusre rajya jaate hain? Haan 1, nahi 2."
  prompt_en: "Do you migrate to another state for work? Yes 1, No 2."
  dtmf:
    "1": {set: {is_migrant: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {is_migrant: "no"}, hi: "Nahi", en: "No"}

- id: Q035_FPO_MEMBER
  layer: occupation
  writes: fpo_member
  requires: "occupation == 'farmer'"
  gain: 4
  why: "FPO membership is a precondition for aggregation and market-linkage schemes."
  tags: [occupation, market]
  say_key: q035_fpo
  prompt_hi: "Kisi kisan samooh ya FPO ke sadasya hain? Haan 1, nahi 2."
  prompt_en: "Are you a member of a farmer group or FPO? Yes 1, No 2."
  dtmf:
    "1": {set: {fpo_member: "yes"}, hi: "Haan", en: "Yes"}
    "2": {set: {fpo_member: "no"}, hi: "Nahi", en: "No"}

# ===========================================================================
# LAYER 5 — LAND (10). Gated behind owns_land. Classic DAG chain.
# ===========================================================================
- id: Q040_OWNS_LAND
  layer: land
  writes: owns_land
  requires: "occupation in ['farmer','agri_labour','livestock'] or purpose in ['income_support','crop_insurance','equipment_subsidy','credit_loan']"
  gain: 9
  why: "The gate for the entire land subgraph. A no here closes nine downstream questions at once, which is exactly what the DAG is for."
